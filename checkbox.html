<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Nesting</title>

        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            label {
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                border: 1px solid #bbb;
                border-radius: 3px;
                width: 50px;
                height: 50px;

                input[type="checkbox"] {
                    display: none;
                }
            }

            label:has(input[type="checkbox"]:checked) {
                background-color: #0400ff;
                span {
                    width: 25px;
                    height: 14px;
                    transform: rotate(-60deg);
                    border-left: 4px solid #fff;
                    border-bottom: 4px solid #fff;
                }
            }
        </style>
    </head>
    <body>
        <div>
            <label for="checkbox">
                <input type="checkbox" id="checkbox" />
                <span></span>
            </label>
        </div>
    </body>
</html>
