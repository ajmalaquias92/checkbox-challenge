<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Gallery</title>

        <style>
            body {
                min-height: 100vh;
                margin: 0;
                background-color: #ccc;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-family: sans-serif;
            }

            .gallery {
                background-color: #fff;
                padding: 1rem;
                width: 90%;
                max-width: 960px;
                box-sizing: border-box;
                display: flex;
                flex-wrap: wrap;
                gap: 1rem;
                box-shadow: 0 0 .3rem rgba(0, 0, 0, 0.5);
            }

            .image {
                min-width: 0;
                flex: 0 0 calc(25% - 0.75rem);
            }

            .image a {
                position: relative;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                width: 100%;
                text-decoration: none;
                color: #000;
                font-size: 0.8rem;
                text-align: center;
            }

            .image img {
                width: 100%;
                transition:
                    opacity 0.5s ease,
                    transform 0.5s ease;
                opacity: 0.6;
            }

            .image img:hover {
                transform: scale(1.3);
                opacity: 1;
            }

            .image p {
                background-color: rgba(0, 0, 0, 0.7);
                color: #fff;
                margin: 0;
                padding: 0.5rem;
                position: absolute;
                width: 100%;
                bottom: 0;
                transform: translateY(100%);
                transition: transform 0.5s ease;
            }

            .image:hover p {
                transform: translateY(0);
            }
        </style>
    </head>
    <body>
        <h1>Gallery</h1>
        <section class="gallery">
            <div class="image">
                <a href="#">
                    <img src="https://picsum.photos/500/400?random=1" />
                    <p>Image description</p>
                </a>
            </div>

            <div class="image">
                <a href="#">
                    <img src="https://picsum.photos/500/400?random=2" />
                    <p>Image description</p>
                </a>
            </div>

            <div class="image">
                <a href="#">
                    <img src="https://picsum.photos/500/400?random=3" />
                    <p>Image description</p>
                </a>
            </div>

            <div class="image">
                <a href="#">
                    <img src="https://picsum.photos/500/400?random=4" />
                    <p>Image description</p>
                </a>
            </div>

            <div class="image">
                <a href="#">
                    <img src="https://picsum.photos/500/400?random=5" />
                    <p>Image description</p>
                </a>
            </div>

            <div class="image">
                <a href="#">
                    <img src="https://picsum.photos/500/400?random=6" />
                    <p>Image description</p>
                </a>
            </div>

            <div class="image">
                <a href="#">
                    <img src="https://picsum.photos/500/400?random=7" />

                </a>
            </div>

            <div class="image">
                <a href="#">
                    <img src="https://picsum.photos/500/400?random=8" />

                </a>
            </div>
        </section>
    </body>
</html>
